name: Competition catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "competitions/**"
      - "schemas/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger MoleculeDesk rebuild
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the VERCEL_DEPLOY_HOOK_URL Actions secret."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --request POST "$VERCEL_DEPLOY_HOOK_URL"
